<!doctype html>
<html data-theme="dark">
<head>
<meta charset="utf-8">
<title>SEC Filing Viewer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<style>
  :root { --ob-chrome-bg: #ffffff; --ob-chrome-fg: #8a8a8a; }
  html[data-theme="dark"] { --ob-chrome-bg: #15151a; --ob-chrome-fg: #9a9aa4; }
  html, body { margin: 0; height: 100%; width: 100%; overflow: hidden; background: var(--ob-chrome-bg); }
  #ob-msg { font-family: system-ui, sans-serif; color: var(--ob-chrome-fg); padding: 1.25rem; font-size: 0.95rem; }
  #ob-doc { padding: 16px 20px; overflow: auto; height: 100%; box-sizing: border-box;
    font-family: system-ui, sans-serif; background: #fff; color: #111; }
  #ob-doc img { max-width: 100%; height: auto; }
  #ob-doc pre.ob-src { margin: 0; padding: 0; white-space: pre-wrap; word-break: break-word;
    font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  #ob-doc pre.ob-src code { background: none; padding: 0; }
  #ob-pdf { display: flex; flex-direction: column; height: 100%; background: #2b2b30;
    color: #e7e7ea; font-family: system-ui, sans-serif; }
  .pv-bar { flex: 0 0 auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 6px 10px; border-bottom: 1px solid #3a3a42; background: #1b1b20; font-size: 13px; }
  .pv-grp { display: flex; align-items: center; gap: 5px; }
  .pv-bar button { background: #26262d; color: #e7e7ea; border: 1px solid #3a3a42; border-radius: 6px;
    padding: 4px 9px; cursor: pointer; font-size: 13px; line-height: 1.1; }
  .pv-bar button:hover { border-color: #6b6b76; }
  .pv-bar input { background: #26262d; color: #e7e7ea; border: 1px solid #3a3a42; border-radius: 6px;
    padding: 4px 7px; font: inherit; }
  #pv-page { width: 46px; text-align: center; }
  #pv-find { width: 190px; }
  #pv-total, #pv-zlevel, #pv-count { color: #9a9aa4; min-width: 28px; text-align: center; }
  .pv-body { flex: 1 1 auto; min-height: 0; display: flex; }
  #pv-toc { flex: 0 0 270px; overflow: auto; background: #16161a; border-right: 1px solid #3a3a42;
    padding: 8px 6px; font-size: 12.5px; }
  #pv-toc ul { list-style: none; margin: 0; padding-left: 13px; }
  #pv-toc > ul { padding-left: 2px; }
  #pv-toc a { color: #cfcfd6; text-decoration: none; display: block; padding: 3px 5px; border-radius: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pv-toc a:hover { background: #26262d; color: #fff; }
  .pv-main { flex: 1 1 auto; position: relative; }
  #viewerContainer { position: absolute; inset: 0; overflow: auto; background: #525659; }
  .ob-hidden { display: none !important; }
</style>
</head>
<body>
<div id="ob-msg">Select a document in the Index Headers to view it here.</div>
<div id="ob-doc" class="ob-hidden"></div>
<div id="ob-pdf" class="ob-hidden">
  <div class="pv-bar">
    <button id="pv-toc-btn" style="display:none" title="Toggle contents">&#9776; Contents</button>
    <span class="pv-grp">Page <input id="pv-page" type="number" min="1" value="1"> / <span id="pv-total">?</span></span>
    <span class="pv-grp"><button id="pv-zout" title="Zoom out">&minus;</button><span id="pv-zlevel">&mdash;</span><button id="pv-zin" title="Zoom in">+</button><button id="pv-zfit">Fit</button></span>
    <span class="pv-grp"><input id="pv-find" type="text" placeholder="Find in document"><button id="pv-prev" title="Previous match">&lsaquo;</button><button id="pv-next" title="Next match">&rsaquo;</button><span id="pv-count"></span></span>
    <a id="pv-open" href="#" target="_blank" rel="noopener" style="margin-left:auto;color:#6ea8ff;text-decoration:none">Open &#8599;</a>
  </div>
  <div class="pv-body">
    <div id="pv-toc" class="ob-hidden"></div>
    <div class="pv-main"><div id="viewerContainer"><div id="viewer" class="pdfViewer"></div></div></div>
  </div>
</div>
<script id="ob-params" type="application/json">[{"paramName":"document_url","label":"Document URL","type":"text","description":"Direct URL of a SEC EDGAR document. Set by clicking a document's URL in the Index Headers table.","value":""}]</script>
<script>window.OB_MCP_BASE = "__OB_MCP_BASE__";</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
(function () {
  var PARAM_DEFS = JSON.parse(document.getElementById("ob-params").textContent || "[]");
  var PARAM_KEYS = PARAM_DEFS.map(function (p) { return p.paramName; });
  var WIDGET_MANIFESTS = [{
    widgetId: "sec-filing-document",
    name: "Filing Document (Markdown)",
    description: "The SEC filing document shown in the viewer, as text/markdown.",
    category: "SEC Filings",
    dataType: "markdown"
  }];
  var target = window.top || window.parent;
  var current = null;
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }

  function announce() {
    if (target && target !== window) {
      target.postMessage(
        { type: "openbb-connect", widgets: WIDGET_MANIFESTS, params: PARAM_DEFS },
        "*"
      );
    }
  }

  function sendDocumentData() {
    if (target === window) return;
    var msg = {
      type: "openbb-data",
      widgetId: "sec-filing-document",
      dataType: "markdown",
      data: "",
    };
    if (!current) { target.postMessage(msg, "*"); return; }
    fetch(window.location.origin
      + "/api/v1/sec/edgar_document_markdown?url=" + encodeURIComponent(current))
      .then(function (r) { return r.json(); })
      .then(function (j) { msg.data = (j && j.content) || ""; target.postMessage(msg, "*"); })
      .catch(function () { target.postMessage(msg, "*"); });
  }

  function applyTheme(t) {
    if (t === "dark" || t === "light") {
      document.documentElement.setAttribute("data-theme", t);
    }
  }

  (function initTheme() {
    try {
      var qp = new URLSearchParams(window.location.search);
      var t = qp.get("theme") || qp.get("appTheme") || qp.get("colorScheme");
      if (t) { applyTheme(t.toLowerCase()); return; }
    } catch (e) {}
    if (window.matchMedia) {
      applyTheme(
        window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
      );
    }
  })();

  function show(id) {
    ["ob-msg", "ob-doc", "ob-pdf"].forEach(function (x) {
      document.getElementById(x).classList.toggle("ob-hidden", x !== id);
    });
  }

  function renderHtmlText(html) {
    var doc = document.getElementById("ob-doc");
    doc.innerHTML = html;
    doc.querySelectorAll('a[href]').forEach(function (a) {
      var href = a.getAttribute("href") || "";
      if (href.charAt(0) === "#") {
        a.addEventListener("click", function (e) {
          e.preventDefault();
          var id = href.slice(1);
          if (!id) { doc.scrollTop = 0; return; }
          var tgt = doc.querySelector('[id="' + id + '"]')
            || doc.querySelector('[name="' + id + '"]');
          if (tgt && tgt.scrollIntoView) {
            tgt.scrollIntoView({ behavior: "smooth", block: "start" });
          }
        });
      } else {
        a.setAttribute("target", "_blank");
        a.setAttribute("rel", "noopener");
      }
    });
    show("ob-doc");
    doc.scrollTop = 0;
  }

  function renderPdf(proxied, u) {
    show("ob-pdf");
    document.getElementById("pv-open").href = u;
    var container = document.getElementById("viewerContainer");
    if (!window.pdfjsLib || !window.pdfjsViewer) {
      container.innerHTML = "<div style='color:#fff;padding:24px'>PDF viewer unavailable.</div>";
      return;
    }
    var eventBus = new pdfjsViewer.EventBus();
    var linkService = new pdfjsViewer.PDFLinkService({ eventBus: eventBus });
    var findController = new pdfjsViewer.PDFFindController({
      eventBus: eventBus, linkService: linkService
    });
    var viewer = new pdfjsViewer.PDFViewer({
      container: container, eventBus: eventBus, linkService: linkService,
      findController: findController, textLayerMode: 2
    });
    linkService.setViewer(viewer);

    var pageEl = document.getElementById("pv-page"),
        totalEl = document.getElementById("pv-total"),
        zlevel = document.getElementById("pv-zlevel"),
        countEl = document.getElementById("pv-count");

    function updZoom() { zlevel.textContent = Math.round(viewer.currentScale * 100) + "%"; }
    function setCount(mc) {
      countEl.textContent = (mc && mc.total) ? ((mc.current || 0) + "/" + mc.total) : "";
    }
    eventBus.on("pagesinit", function () { viewer.currentScaleValue = "page-width"; updZoom(); });
    eventBus.on("scalechanging", function () { setTimeout(updZoom, 0); });
    eventBus.on("pagechanging", function (e) { pageEl.value = e.pageNumber; });
    eventBus.on("updatefindmatchescount", function (e) { setCount(e.matchesCount); });
    eventBus.on("updatefindcontrolstate", function (e) {
      if (e.state === 1) { countEl.textContent = "0/0"; } else { setCount(e.matchesCount); }
    });

    pageEl.addEventListener("change", function () {
      var n = parseInt(pageEl.value, 10);
      if (n >= 1 && viewer.pagesCount && n <= viewer.pagesCount) viewer.currentPageNumber = n;
    });
    document.getElementById("pv-zin").onclick = function () { viewer.currentScale *= 1.15; updZoom(); };
    document.getElementById("pv-zout").onclick = function () { viewer.currentScale /= 1.15; updZoom(); };
    document.getElementById("pv-zfit").onclick = function () { viewer.currentScaleValue = "page-width"; };
    var findEl = document.getElementById("pv-find");
    function doFind(again, prev) {
      eventBus.dispatch("find", {
        source: null, type: again ? "again" : "", query: findEl.value,
        caseSensitive: false, entireWord: false, highlightAll: true,
        findPrevious: !!prev, phraseSearch: true
      });
    }
    findEl.addEventListener("input", function () { doFind(false, false); });
    findEl.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); doFind(true, e.shiftKey); }
    });
    document.getElementById("pv-next").onclick = function () { doFind(true, false); };
    document.getElementById("pv-prev").onclick = function () { doFind(true, true); };
    var tocBtn = document.getElementById("pv-toc-btn"), toc = document.getElementById("pv-toc");
    tocBtn.onclick = function () { toc.classList.toggle("ob-hidden"); };

    fetch(proxied)
      .then(function (r) { return r.arrayBuffer(); })
      .then(function (buf) { return pdfjsLib.getDocument({ data: buf }).promise; })
      .then(function (pdf) {
        viewer.setDocument(pdf);
        linkService.setDocument(pdf, null);
        totalEl.textContent = pdf.numPages;
        pageEl.max = pdf.numPages;
        pdf.getOutline().then(function (outline) {
          if (!outline || !outline.length) return;
          function build(items) {
            var ul = document.createElement("ul");
            items.forEach(function (it) {
              var li = document.createElement("li");
              var a = document.createElement("a");
              a.textContent = it.title || "(untitled)";
              a.href = "#"; a.title = it.title || "";
              a.onclick = function (e) {
                e.preventDefault();
                if (it.dest) linkService.goToDestination(it.dest);
              };
              li.appendChild(a);
              if (it.items && it.items.length) li.appendChild(build(it.items));
              ul.appendChild(li);
            });
            return ul;
          }
          toc.innerHTML = "";
          toc.appendChild(build(outline));
          tocBtn.style.display = "";
          toc.classList.remove("ob-hidden");
        });
      })
      .catch(function () {
        container.innerHTML = "<div style='color:#fff;padding:24px'>Could not load the PDF.</div>";
      });
  }

  function renderXmlText(text, u) {
    var host = document.getElementById("ob-doc");
    host.innerHTML = "";
    var pre = document.createElement("pre");
    pre.className = "ob-src";
    var code = document.createElement("code");
    var lower = u.split("?")[0].toLowerCase();
    code.className =
      (lower.indexOf(".xml") >= 0 || lower.indexOf(".xsd") >= 0)
        ? "language-xml" : "language-plaintext";
    code.textContent = text;
    pre.appendChild(code);
    host.appendChild(pre);
    if (window.hljs) { try { hljs.highlightElement(code); } catch (e) {} }
    show("ob-doc");
    host.scrollTop = 0;
  }

  function renderImage(proxied) {
    var doc = document.getElementById("ob-doc");
    doc.innerHTML = "";
    var img = document.createElement("img");
    img.src = proxied;
    img.alt = "";
    doc.appendChild(img);
    show("ob-doc");
    doc.scrollTop = 0;
  }

  function pushViewerState(u) {
    if (!window.OB_MCP_BASE || window.OB_MCP_BASE.indexOf("__OB_MCP") === 0) return;
    try {
      fetch(window.OB_MCP_BASE + "/viewer-state", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: u }),
      }).catch(function () {});
    } catch (e) {}
  }

  function render(u) {
    if (!u) { show("ob-msg"); current = null; pushViewerState(null); return; }
    if (u === current) return;
    current = u;
    pushViewerState(u);
    var proxied = window.location.origin
      + "/api/v1/sec/edgar_document?url=" + encodeURIComponent(u);
    var clean = u.split("?")[0].toLowerCase();
    if (/\.pdf$/.test(clean)) { renderPdf(proxied, u); return; }
    if (/\.(jpe?g|png|gif|bmp|webp|tiff?)$/.test(clean)) { renderImage(proxied); return; }
    fetch(proxied)
      .then(function (r) {
        var ct = (r.headers.get("content-type") || "").toLowerCase();
        if (ct.indexOf("image/") >= 0) { renderImage(proxied); return; }
        if (ct.indexOf("pdf") >= 0) { renderPdf(proxied, u); return; }
        return r.text().then(function (t) {
          if (ct.indexOf("html") >= 0) { renderHtmlText(t); }
          else { renderXmlText(t, u); }
        });
      })
      .catch(function () {
        document.getElementById("ob-doc").textContent = "Could not load the document.";
        show("ob-doc");
      });
  }

  function renderDefault() {
    fetch(window.location.origin + "/api/v1/sec/filing_headers?url=")
      .then(function (r) { return r.json(); })
      .then(function (j) {
        var docs = (j && j.results && j.results.document_urls) || [];
        if (docs.length && docs[0].url) render(docs[0].url);
      })
      .catch(function () {});
  }

  function applyParams(params) {
    if (!params) return;
    var pairs = [];
    if (Array.isArray(params)) {
      pairs = params.map(function (p) { return [p.paramName || p.name, p.value]; });
    } else if (typeof params === "object") {
      pairs = Object.keys(params).map(function (k) {
        var v = params[k];
        return [k, (v && typeof v === "object" && "value" in v) ? v.value : v];
      });
    }
    var qs = new URLSearchParams(window.location.search), changed = false;
    pairs.forEach(function (pair) {
      var k = pair[0], v = pair[1];
      if (!k || v == null || PARAM_KEYS.indexOf(k) < 0) return;
      var s = String(v);
      if (qs.get(k) !== s) { qs.set(k, s); changed = true; }
    });
    if (changed) window.location.search = qs.toString();
  }

  window.addEventListener("message", function (event) {
    var d = event.data;
    if (!d || typeof d !== "object") return;
    var theme = d.theme || (d.payload && d.payload.theme);
    if (typeof theme === "string") applyTheme(theme.toLowerCase());
    if (!d.type) return;
    if (d.type === "openbb-request") {
      if (d.widgetId === null || d.widgetId === undefined
          || d.widgetId === "sec-filing-document") {
        sendDocumentData();
      }
    } else if (d.type === "openbb-params-update" || d.type === "openbb:widget-params:update") {
      applyParams(d.params || d.payload || d.data || d.values || d);
    }
  });

  try {
    var initial = new URLSearchParams(window.location.search).get("document_url");
    if (initial) { render(initial); }
    else { renderDefault(); }
  } catch (e) {}

  announce();
  setTimeout(announce, 250);
})();
</script>
</body>
</html>
